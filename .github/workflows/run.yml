          echo "  - '+.mbs.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.mpnbenefits.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.mpnbenefitsrtl.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.mpnbenefitsrtluat.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.msdn.download.prss.microsoft.com'" >> microsoft.txt
