          echo "  - '+.azuremigrate.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.azuremigratetest.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.azurestackhub.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.azurestackhubuat.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.cbdstest.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.collaborate.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.collaborateppe.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.dcg.microsoft.com'" >> microsoft.txt
          echo "  - '+.devblogs.microsoft.com'" >> microsoft.txt
          echo "  - '+.developer.microsoft.com'" >> microsoft.txt
          echo "  - '+.dl.delivery.mp.microsoft.com'" >> microsoft.txt
          echo "  - '+.docs.microsoft.com'" >> microsoft.txt
          echo "  - '+.download.microsoft.com'" >> microsoft.txt
          echo "  - '+.download.visualstudio.microsoft.com'" >> microsoft.txt
          echo "  - '+.dreamspark.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.dreamsparkuat.download.prss.microsoft.com'" >> microsoft.txt
          echo "  - '+.fs.microsoft.com'" >> microsoft.txt
